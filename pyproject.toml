[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nanomerger"
version = "0.1.0"
description = "Merge numbered EPLAN/DWG drawings into one model-space strip and a sheet-per-page PDF."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "NanoMerger contributors"}]
keywords = ["dwg", "dxf", "eplan", "cad", "pdf", "merge"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: Manufacturing",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "ezdxf==1.4.3",
  "matplotlib>=3.9,<4",
  "Pillow>=10,<13",
]

[project.optional-dependencies]
gui = ["PySide6>=6.8,<6.10"]
build = ["pyinstaller>=6.16,<7"]
dev = ["pytest>=8,<9", "ruff>=0.11,<1", "build", "pypdf>=5,<7", "PySide6>=6.8,<6.10"]

[project.scripts]
nanomerger = "nanomerger.cli:main"

[project.gui-scripts]
nanomerger-gui = "nanomerger.gui:main"

[tool.setuptools.packages.find]
include = ["nanomerger*"]

[tool.setuptools.package-data]
nanomerger = ["assets/*", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
