name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libdbus-1-3 libxcb-cursor0 libxcb-xinerama0
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check nanomerger tests examples build_exe.py
      - name: Check EXE build command
        run: python build_exe.py --dry-run --use-current-env
      - name: Tests (DXF core; proprietary ODA is not installed in CI)
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q
      - name: Build wheel
        run: python -m build --wheel
